{% extends "base.html" %}

{% block title %}{{ title or "오류" }} | 영화 콘텐츠{% endblock %}

{% block content %}
  <section class="message-box error-message" role="alert">
    <p class="status-code">{{ status_code }}</p>
    <h1>{{ title or "요청을 처리하지 못했습니다." }}</h1>
    <p>{{ message }}</p>
    <a href="{{ url_for('pages.index') }}">영화 목록으로 돌아가기</a>
  </section>
{% endblock %}
