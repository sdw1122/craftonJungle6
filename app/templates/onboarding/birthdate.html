{% extends "base.html" %}
{% block title %}생년월일 입력 - 키노라이츠{% endblock %}
{% block content %}
  <section class="card onboarding-card">
    <div class="progress-bar"><span style="width: 66%"></span></div>
    <h1>생년월일을 알려주세요</h1>

    {% if error %}<p class="field-error">{{ error }}</p>{% endif %}

    <form method="post" class="onboarding-form">
      <div class="date-select-row">
        <select name="year" required>
          <option value="" disabled selected>연도</option>
          {% for y in range(2015, 1939, -1) %}
            <option value="{{ y }}">{{ y }}</option>
          {% endfor %}
        </select>
        <select name="month" required>
          <option value="" disabled selected>월</option>
          {% for m in range(1, 13) %}
            <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
        <select name="day" required>
          <option value="" disabled selected>일</option>
          {% for d in range(1, 32) %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="onboarding-nav">
        <a class="button button-secondary" href="{{ url_for('onboarding.gender') }}">이전</a>
        <button type="submit" class="button">다음</button>
      </div>
    </form>
  </section>
{% endblock %}
