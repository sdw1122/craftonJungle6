{% extends "base.html" %}
{% block title %}성별 입력 - 키노라이츠{% endblock %}
{% block content %}
  <section class="card onboarding-card">
    <div class="progress-bar"><span style="width: 33%"></span></div>
    <h1>성별을 알려주세요</h1>

    {% if error %}<p class="field-error">{{ error }}</p>{% endif %}

    <form method="post" class="option-grid">
      {% for value, label in labels.items() %}
        <button type="submit" name="gender" value="{{ value }}" class="option-button">{{ label }}</button>
      {% endfor %}
    </form>
  </section>
{% endblock %}
