{% extends "base.html" %}

{% block title %}설정 - 키노라이츠{% endblock %}

{% block content %}
<section class="card" style="margin-top: 50px;">
    <h1>설정</h1>
    <p class="description">계정 정보와 서비스 환경을 설정할 수 있습니다.</p>

    <div style="margin-top: 30px;">
        <h3>내 정보 관리</h3>
        <ul style="list-style: none; padding: 0; margin-top: 15px;">
            <li style="padding: 15px 0; border-bottom: 1px solid #333;">
                <a href="{{ url_for('settings.change_password') }}"
                    style="color: inherit; display: flex; align-items: center; gap: 8px; text-decoration: none;">
                    <span>비밀번호 변경</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                    </svg>
                </a>
            </li>
            <li style="padding: 15px 0; border-bottom: 1px solid #333;">
                <a href="{{ url_for('onboarding.genres') }}"
                    style="text-decoration: none; color: inherit; display: block;">
                    선호 장르 다시 선택하기
                </a>
            </li>
            <li style="padding: 15px 0; border-bottom: 1px solid #333;">리뷰 관리</li>
        </ul>
    </div>
</section>
{% endblock %}
