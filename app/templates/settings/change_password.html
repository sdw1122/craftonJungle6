{% extends "base.html" %}

{% block title %}비밀번호 변경 - 키노라이츠{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>비밀번호 변경</h1>

    <p class="description">
        안전한 서비스 이용을 위해 현재 비밀번호를 확인합니다.
    </p>

    <form method="post" action="{{ url_for('settings.change_password') }}" class="auth-form">
        <label for="current_password">
            현재 비밀번호
            <input type="password" id="current_password" name="current_password" required
                autocomplete="current-password" autofocus>
        </label>

        <label for="new_password">
            새 비밀번호
            <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="128"
                autocomplete="new-password">
        </label>

        <label for="confirm_password">
            새 비밀번호 확인
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="128"
                autocomplete="new-password">
        </label>

        <button type="submit" class="button">
            비밀번호 변경
        </button>

        <a href="{{ url_for('pages.settings') }}" class="button button-secondary">
            취소
        </a>
    </form>
</section>
{% endblock %}
