{% extends "base.html" %}

{% block title %}영화 검색 - 키노라이츠{% endblock %}

{% block content %}
<section class="search-hero">
  <h1>어떤 작품을 찾으시나요?</h1>

  <div class="search-box">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="작품, 인물을 검색해보세요">
    </div>
    <button type="button" onclick="handleSearch()" class="button search-submit">검색</button>
  </div>
</section>

<section class="search-results">
  <div id="movieGrid" class="movie-grid"></div>
</section>

<script>
  document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') handleSearch();
  });

  async function handleSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const grid = document.getElementById('movieGrid');

    if (!query) {
      alert('검색어를 입력해 주세요!');
      return;
    }

    grid.innerHTML = '<p class="search-status">검색 중...</p>';

    try {
      const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
      const result = await response.json();

      if (result.status === 'success') {
        renderMovies(result.data);
      } else {
        grid.innerHTML = `<p class="search-status">${result.message}</p>`;
      }
    } catch (error) {
      console.error('Error:', error);
      grid.innerHTML = '<p class="search-status">서버 통신 중 오류가 발생했습니다.</p>';
    }
  }

  function renderMovies(movies) {
    const grid = document.getElementById('movieGrid');
    grid.innerHTML = '';

    if (movies.length === 0) {
      grid.innerHTML = '<p class="search-status">검색 결과가 없습니다.</p>';
      return;
    }

    movies.forEach(movie => {
      const card = document.createElement('div');
      card.className = 'movie-card';

      const posterSrc = movie.poster_url || 'https://via.placeholder.com/160x230?text=No+Image';

      card.innerHTML = `
        <img class="movie-card-poster" src="${posterSrc}" alt="${movie.title}">
        <h4 class="movie-card-title">${movie.title}</h4>
      `;
      grid.appendChild(card);
    });
  }
</script>
{% endblock %}
