{% extends "base.html" %}
{% block title %}로그인 - 키노라이츠{% endblock %}
{% block content %}
  <section class="card auth-card">
    <h1>로그인</h1>
    <form method="post" class="auth-form">
      <label>
        이메일
        <input type="email" name="email" required autofocus>
      </label>
      <label>
        비밀번호
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="button">로그인</button>
    </form>

    <div class="divider"><span>또는</span></div>
    <a class="button button-google" href="{{ url_for('auth.google_login') }}">구글로 계속하기</a>

    <p class="auth-switch">
      계정이 없으신가요? <a href="{{ url_for('auth.signup') }}">회원가입</a>
    </p>
  </section>
{% endblock %}
