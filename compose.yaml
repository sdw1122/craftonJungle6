services:
  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flask_app}
      POSTGRES_USER: ${POSTGRES_USER:-flask_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flask_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - .:/app
    environment:
      FLASK_DEBUG: "1"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-flask_app}
      DB_USER: ${POSTGRES_USER:-flask_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flask_password}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
